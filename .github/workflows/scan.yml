name: Roblox Game Scout

on:
  schedule:
    - cron: "0 * * * *"   # runs every hour, on the hour (UTC)
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python scan.py

      - name: Commit and push results
        run: |
          git config user.name "roblox-scout-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Scan update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
